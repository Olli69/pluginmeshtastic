name: Android CI

on:
  push:
    branches: [ "feat/lockdown" ]
  pull_request:
    branches: [ "feat/lockdown" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pluginmeshtastic
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Checkout ATAK-CIV SDK
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: TAK-Product-Center/atak-civ
          path: atak-civ-sdk

      - name: Configure local.properties and accept licenses
        run: |
          # Hyväksytään Android-lisenssit viralliseen SDK:hon
          yes | sdkmanager --licenses || true
          
          # Luodaan local.properties template-pohjasta
          cp template.local.properties local.properties
          
          # Asetetaan oikea virallinen Android SDK -polku
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          
          # Ohjataan takdev osoittamaan juuri ladatun Git-repon pluginsdk-kansioon
          echo "takdev.plugin=${{ github.workspace }}/atak-civ-sdk/pluginsdk" >> local.properties

      - name: Käännä APK virallisilla parametreilla
        run: ./gradlew :app:assembleCivDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-debug
          path: app/build/outputs/apk/**/*.apk
