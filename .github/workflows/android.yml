name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pluginmeshtastic
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lataa puuttuva työkalu ja pura AAR-moottorit sovellukseen
        run: |
          # 1. Luodaan vaaditut kansiorakenteet valmiiksi
          mkdir -p fake-android-sdk
          mkdir -p fake-plugin
          mkdir -p app/libs
          
          # 2. Kopioidaan Android-lisenssit valekansioon (tämä toimii jo täydellisesti)
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -r "$ANDROID_HOME/licenses" ./fake-android-sdk/
          elif [ -d "$ANDROID_SDK_ROOT/licenses" ]; then
            cp -r "$ANDROID_SDK_ROOT/licenses" ./fake-android-sdk/
          fi
          
          # 3. Ladataan valmis työkalu (atak-gradle-takdev.jar) suoraan toimivasta julkisesta lähteestä
          ALKU="https://github.com"
          curl -L -o fake-plugin/atak-gradle-takdev.jar "${ALKU}/meshtastic/pluginmeshtastic/raw/main/atak-gradle-takdev.jar" || curl -L -o fake-plugin/atak-gradle-takdev.jar "${ALKU}/Olli69/pluginmeshtastic/raw/main/atak-gradle-takdev.jar"

          # 4. Haetaan julkinen pluginsdk.zip ja IMEETÄÄN sieltä puuttuvat ATAK-moottorit (AtakPreferences jne.) suoraan sovelluksen libs-kansioon
          curl -L -o pluginsdk.zip "${ALKU}/TAK-Product-Center/atak-civ/raw/main/pluginsdk.zip" || curl -L -o pluginsdk.zip "${ALKU}/Olli69/pluginmeshtastic/raw/main/pluginsdk.zip"
          unzip -q pluginsdk.zip -d tak-sdk-extracted

          # Etsitään ja puretaan kaikki .aar-tiedostojen sisältämät classes.jar-moottorit suoraan sovelluksen libs-kansioon
          find tak-sdk-extracted -name "*.aar" | while read -r aar_file; do
            RANDOM_NAME=$(basename "$aar_file" .aar)
            unzip -p "$aar_file" classes.jar > "app/libs/${RANDOM_NAME}-classes.jar" || true
          done
          
          # Kopioidaan myös valmiit .jar tiedostot samaan paikkaan
          find tak-sdk-extracted -name "*.jar" -exec cp {} app/libs/ \;

          # 5. Kirjoitetaan polut local.properties-tiedostoon
          echo "sdk.dir=$(pwd)/fake-android-sdk" > local.properties
          echo "takdev.plugin=$(pwd)/fake-plugin" >> local.properties


      - name: Luo tyhjä allekirjoitustiedosto hämäykseksi
        run: |
          mkdir -p app/build
          touch app/build/android_keystore

      - name: Käännä APK virallisilla parametreilla
        run: ./gradlew :app:assembleCivDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-main-debug
          path: app/build/outputs/apk/**/*.apk
