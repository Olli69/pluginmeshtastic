name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pluginmeshtastic
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lataa puuttuva työkalu ja luo local.properties
        run: |
          # 1. Luodaan vale-android-polku valmiiksi
          mkdir -p fake-android-sdk
          mkdir -p fake-plugin
          
          # 2. Ladataan valmis atak-gradle-takdev.jar suoraan toimivasta julkisesta lähteestä
          ALKU="https://github.com"
          curl -L -o fake-plugin/atak-gradle-takdev.jar "${ALKU}/Olli69/pluginmeshtastic/raw/main/atak-gradle-takdev.jar" || curl -L -o fake-plugin/atak-gradle-takdev.jar "${ALKU}/meshtastic/pluginmeshtastic/raw/main/atak-gradle-takdev.jar"

          # 3. Kirjoitetaan polut local.properties-tiedostoon
          cp template.local.properties local.properties
          echo "sdk.dir=$(pwd)/fake-android-sdk" > local.properties
          echo "takdev.plugin=$(pwd)/fake-plugin" >> local.properties

      - name: Luo tyhjä allekirjoitustiedosto hämäykseksi
        run: |
          mkdir -p app/build
          touch app/build/android_keystore

      - name: Käännä APK virallisilla parametreilla
        run: ./gradlew :app:assembleCivDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-main-debug
          path: app/build/outputs/apk/**/*.apk
