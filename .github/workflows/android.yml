name: Android CI
on:
  push:
    branches: [ "feat/lockdown" ]
  pull_request:
    branches: [ "feat/lockdown" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew



      - name: Checkout ATAK-CIV SDK
        uses: actions/checkout@v4
        with:
          repository: TAK-Product-Center/atak-civ
          path: atak-civ-sdk
      - name: Configure local.properties
        run: |
          cp template.local.properties local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "takdev.plugin=${{ github.workspace }}/atak-civ-sdk" >> local.properties
          
      - name: Build with Gradle
        run: ./gradlew :app:assembleCivDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-debug
          path: app/build/outputs/apk/**/*.apk
