name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pluginmeshtastic
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lataa ATAK SDK ja asenna se järjestelmään
        run: |
          # 1. Haetaan se virallinen julkinen pluginsdk.zip nettiosoitteesta
          ALKU="https://github.com"
          OSOITE="${ALKU}/TAK-Product-Center/atak-civ/raw/main/pluginsdk.zip"
          curl -L -o pluginsdk.zip "$OSOITE"
          
          # 2. Puretaan zip-paketti
          unzip -q pluginsdk.zip -d extracted-sdk

          # 3. Mennään ladatun SDK:n sisään ja ajetaan sen oma virallinen asennuskomento,
          # joka rekisteröi 'atak-takdev-plugin' -työkalun osaksi järjestelmän Maven-muistia.
          cd extracted-sdk/pluginsdk
          chmod +x gradlew
          ./gradlew publishToMavenLocal

          # 4. Palataan takaisin projektin juureen ja luodaan local.properties
          cd ../..
          cp template.local.properties local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "takdev.plugin=$(pwd)/extracted-sdk/pluginsdk" >> local.properties

      - name: Luo tyhjä allekirjoitustiedosto hämäykseksi
        run: |
          mkdir -p app/build
          touch app/build/android_keystore

      - name: Käännä APK virallisilla parametreilla
        run: ./gradlew :app:assembleCivDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-main-debug
          path: app/build/outputs/apk/**/*.apk
