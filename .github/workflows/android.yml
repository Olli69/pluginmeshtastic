name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pluginmeshtastic
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Etsi SDK-työkalu ja asenna se automaattisesti
        run: |
          # 1. Ohitetaan LFS-budjettimuuri
          ALKU="https://github.com"
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --recursive "${ALKU}/TAK-Product-Center/atak-civ.git" extracted-sdk
          
          # 2. ETSITÄÄN automaattisesti se kansio, jossa ATAK SDK:n oma gradlew asuu
          # (Tämä skippaa koko kansioiden nimien arpomisen ja löytää oikean paikan sataprosenttisen varmasti)
          SDK_GRADLEW_PATH=$(find $(pwd)/extracted-sdk -name "gradlew" | grep -i "pluginsdk" | head -n 1)
          SDK_DIR=$(dirname "$SDK_GRADLEW_PATH")
          
          echo "Löytyi aito SDK-työkalukansio polusta: $SDK_DIR"
          cd "$SDK_DIR"
          
          # 3. Ajetaan asennuskomento, joka rekisteröi työkalun järjestelmän muistiin
          chmod +x gradlew
          ./gradlew publishToMavenLocal

          # 4. Palataan projektin juureen ja luodaan local.properties
          cd "${{ github.workspace }}"
          cp template.local.properties local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "takdev.plugin=$SDK_DIR" >> local.properties
