name: Android CI
on:
  push:
    branches: [ "feat/lockdown" ]
  pull_request:
    branches: [ "feat/lockdown" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew



      - name: Checkout ATAK-CIV SDK
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: TAK-Product-Center/atak-civ
          path: atak-civ-sdk
      - name: Configure local.properties
        run: |
          cp template.local.properties local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "takdev.plugin=${{ github.workspace }}/atak-civ-sdk" >> local.properties



      - name: Hae ATAK SDK julkisesta varastosta
        run: |
          # Tehdään vale-android-polku valmiiksi
          mkdir -p fake-android-sdk
          
          # Haetaan se löytämäsi julkinen pluginsdk.zip
          ALKU="https://github.com"
          OSOITE="${ALKU}/TAK-Product-Center/atak-civ/raw/main/pluginsdk.zip"
          curl -L -o pluginsdk.zip "$OSOITE"
          unzip -q pluginsdk.zip -d tak-sdk-extracted
  
          # Kirjoitetaan polut suoraan kansiorakenteeseen, jotta arvo ei jää tyhjäksi
          echo "sdk.dir=$(pwd)/fake-android-sdk" > local.properties
          echo "takdev.plugin=$(pwd)/tak-sdk-extracted/pluginsdk" >> local.properties
  
      - name: Käännä APK virallisilla parametreilla
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleCivDebug
  
  
        
   
        
      - uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-debug
          path: app/build/outputs/apk/**/*.apk
