name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pluginmeshtastic
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lataa ATAK SDK Gitillä ja asenna järjestelmään
        run: |
          # 1. Haetaan virallinen ATAK-CIV koodivarasto Git-komennolla (koko n. 50-100MB)
          ALKU="https://github.com"
          git clone --recursive "${ALKU}/TAK-Product-Center/atak-civ.git" extracted-sdk
          
          # 2. Mennään suoraan sen toimivan työkalukansion sisään
          cd extracted-sdk/pluginsdk
          
          # 3. Ajetaan asennuskomento, joka rekisteröi 'atak-takdev-plugin' järjestelmän Maven-muistiin
          chmod +x gradlew
          ./gradlew publishToMavenLocal

          # 4. Palataan projektin juureen ja luodaan local.properties
          cd ../..
          cp template.local.properties local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "takdev.plugin=$(pwd)/extracted-sdk/pluginsdk" >> local.properties

      - name: Luo tyhjä allekirjoitustiedosto hämäykseksi
        run: |
          mkdir -p app/build
          touch app/build/android_keystore

      - name: Käännä APK virallisilla parametreilla
        run: ./gradlew :app:assembleCivDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-main-debug
          path: app/build/outputs/apk/**/*.apk
