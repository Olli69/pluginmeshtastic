name: Android CI

on:
  push:
    branches: [ "feat/lockdown" ]
  pull_request:
    branches: [ "feat/lockdown" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Checkout ATAK-CIV SDK
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: TAK-Product-Center/atak-civ
          path: atak-civ-sdk

      - name: Hae ATAK-kirjastot ja pura AAR-moottorit sovellukseen
        run: |
          # Luodaan vale-android-polku ja libs-kansiot valmiiksi
          mkdir -p fake-android-sdk
          mkdir -p app/libs
          
          # Haetaan se virallinen julkinen pluginsdk.zip
          ALKU="https://github.com"
          OSOITE="${ALKU}/TAK-Product-Center/atak-civ/raw/main/pluginsdk.zip"
          curl -L -o pluginsdk.zip "$OSOITE"
          unzip -q pluginsdk.zip -d tak-sdk-extracted

          # 1. Kopioidaan kaikki standardit .jar tiedostot libs-kansioon
          find tak-sdk-extracted -name "*.jar" -exec cp {} app/libs/ \;

          # 2. Kopioidaan ja puretaan kaikki .aar tiedostot, jotta Kotlin löytää luokat (AtakPreferences jne.)
          find tak-sdk-extracted -name "*.aar" | while read -r aar_file; do
            # Puretaan jokaisen .aar-tiedoston sisällä oleva classes.jar suoraan libs-kansioon yksilöllisellä nimellä
            RANDOM_NAME=$(basename "$aar_file" .aar)
            unzip -p "$aar_file" classes.jar > "app/libs/${RANDOM_NAME}-classes.jar" || true
          done

          # Kirjoitetaan peruspolut local.properties-tiedostoon varmuuden vuoksi
          echo "sdk.dir=$(pwd)/fake-android-sdk" > local.properties
          echo "takdev.plugin=$(pwd)/tak-sdk-extracted/pluginsdk" >> local.properties

      - name: Configure local.properties and accept licenses
        run: |
          yes | sdkmanager --licenses || true
          cp template.local.properties local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "takdev.plugin=${{ github.workspace }}/atak-civ-sdk/pluginsdk" >> local.properties

      - name: Luo puuttuva allekirjoituskansio allekirjoitusta varten
        run: |
          mkdir -p app/build
          touch app/build/android_keystore
            
      - name: Käännä APK virallisilla parametreilla
        run: ./gradlew :app:assembleCivDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-debug
          path: app/build/outputs/apk/**/*.apk
