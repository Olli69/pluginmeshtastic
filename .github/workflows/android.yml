name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pluginmeshtastic
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lataa ATAK SDK ilman LFS-jättitiedostoja ja asenna järjestelmään
        run: |
          # 1. Ohitetaan LFS-budjettimuuri (tämä toimii jo täydellisesti)
          ALKU="https://github.com"
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --recursive "${ALKU}/TAK-Product-Center/atak-civ.git" extracted-sdk
          
          # 2. Mennään suoraan oikeaan kansioon (huomaa iso S-kirjain: pluginSdk)
          cd extracted-sdk/pluginSdk
          
          # 3. Ajetaan asennuskomento, joka rekisteröi työkalun järjestelmän muistiin
          chmod +x gradlew
          ./gradlew publishToMavenLocal

          # 4. Palataan projektin juureen ja luodaan local.properties
          cd "${{ github.workspace }}"
          cp template.local.properties local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "takdev.plugin=$(pwd)/extracted-sdk/pluginSdk" >> local.properties


      - name: Luo tyhjä allekirjoitustiedosto hämäykseksi
        run: |
          mkdir -p app/build
          touch app/build/android_keystore

      - name: Käännä APK virallisilla parametreilla
        run: ./gradlew :app:assembleCivDebug

      - name: Tallenna valmis APK ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: pluginmeshtastic-main-debug
          path: app/build/outputs/apk/**/*.apk
